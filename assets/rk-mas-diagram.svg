<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Diagram: modular aisle rack with cable tray, busway, and piping">
  <title>RK-MAS Diagram</title>
  <desc>Isometric-style aisle rack showing cable tray, busway, and piping support. Diagram only — not a project photo.</desc>
  <rect width="480" height="360" fill="#161b20"/>
  <!-- Floor -->
  <polygon points="40,300 240,340 440,300 240,260" fill="#1c2329" stroke="#2c3640" stroke-width="1"/>
  <!-- Left upright -->
  <rect x="100" y="80" width="16" height="200" fill="#6b8499"/>
  <rect x="108" y="80" width="8" height="200" fill="#8fa3b5" opacity="0.5"/>
  <!-- Right upright -->
  <rect x="364" y="80" width="16" height="200" fill="#6b8499"/>
  <rect x="372" y="80" width="8" height="200" fill="#8fa3b5" opacity="0.5"/>
  <!-- Mid uprights -->
  <rect x="180" y="90" width="12" height="190" fill="#4a5d6e"/>
  <rect x="288" y="90" width="12" height="190" fill="#4a5d6e"/>
  <!-- Cross beams -->
  <rect x="100" y="120" width="280" height="10" fill="#8fa3b5"/>
  <rect x="100" y="180" width="280" height="10" fill="#8fa3b5" opacity="0.75"/>
  <rect x="100" y="240" width="280" height="10" fill="#8fa3b5" opacity="0.55"/>
  <!-- Cable tray (amber accent) -->
  <rect x="120" y="105" width="240" height="14" rx="2" fill="#c45c26" opacity="0.85"/>
  <line x1="130" y1="108" x2="130" y2="116" stroke="#e08a4f" stroke-width="1.5"/>
  <line x1="150" y1="108" x2="150" y2="116" stroke="#e08a4f" stroke-width="1.5"/>
  <line x1="170" y1="108" x2="170" y2="116" stroke="#e08a4f" stroke-width="1.5"/>
  <line x1="190" y1="108" x2="190" y2="116" stroke="#e08a4f" stroke-width="1.5"/>
  <line x1="210" y1="108" x2="210" y2="116" stroke="#e08a4f" stroke-width="1.5"/>
  <line x1="230" y1="108" x2="230" y2="116" stroke="#e08a4f" stroke-width="1.5"/>
  <line x1="250" y1="108" x2="250" y2="116" stroke="#e08a4f" stroke-width="1.5"/>
  <line x1="270" y1="108" x2="270" y2="116" stroke="#e08a4f" stroke-width="1.5"/>
  <line x1="290" y1="108" x2="290" y2="116" stroke="#e08a4f" stroke-width="1.5"/>
  <line x1="310" y1="108" x2="310" y2="116" stroke="#e08a4f" stroke-width="1.5"/>
  <line x1="330" y1="108" x2="330" y2="116" stroke="#e08a4f" stroke-width="1.5"/>
  <line x1="350" y1="108" x2="350" y2="116" stroke="#e08a4f" stroke-width="1.5"/>
  <!-- Busway -->
  <rect x="130" y="155" width="220" height="12" rx="1" fill="#4a7a9e"/>
  <rect x="130" y="157" width="220" height="4" fill="#6a9abe" opacity="0.6"/>
  <!-- Piping -->
  <circle cx="150" cy="215" r="8" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <circle cx="190" cy="215" r="8" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <circle cx="230" cy="215" r="6" fill="none" stroke="#9aa7b2" stroke-width="2.5"/>
  <circle cx="265" cy="215" r="6" fill="none" stroke="#9aa7b2" stroke-width="2.5"/>
  <line x1="158" y1="215" x2="182" y2="215" stroke="#7a9e7e" stroke-width="3"/>
  <line x1="198" y1="215" x2="224" y2="215" stroke="#7a9e7e" stroke-width="2"/>
  <!-- Labels -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#9aa7b2">
    <rect x="390" y="100" width="10" height="10" fill="#c45c26"/>
    <text x="406" y="109">Cable tray</text>
    <rect x="390" y="150" width="10" height="10" fill="#4a7a9e"/>
    <text x="406" y="159">Busway</text>
    <circle cx="395" cy="205" r="5" fill="none" stroke="#7a9e7e" stroke-width="2"/>
    <text x="406" y="209">Piping</text>
  </g>
  <text x="240" y="350" text-anchor="middle" fill="#6b7883" font-size="10" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">DIAGRAM · RK-MAS AISLE RACK</text>
</svg>
