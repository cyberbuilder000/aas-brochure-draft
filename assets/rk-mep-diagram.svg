<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Diagram: equipment platform with AHU and pump">
  <title>RK-MEP Diagram</title>
  <desc>Equipment platform supporting AHU and pump with access stairs. Diagram only — not a project photo.</desc>
  <rect width="480" height="360" fill="#161b20"/>
  <!-- Ground -->
  <polygon points="30,310 240,350 450,310 240,270" fill="#1c2329" stroke="#2c3640"/>
  <!-- Platform deck -->
  <polygon points="80,200 240,230 400,200 240,170" fill="#2c3640" stroke="#8fa3b5" stroke-width="1.5"/>
  <polygon points="80,200 80,215 240,245 240,230" fill="#1c2329" stroke="#4a5d6e"/>
  <polygon points="240,230 240,245 400,215 400,200" fill="#161b20" stroke="#4a5d6e"/>
  <!-- Legs -->
  <rect x="95" y="210" width="12" height="85" fill="#6b8499"/>
  <rect x="220" y="235" width="12" height="70" fill="#6b8499"/>
  <rect x="373" y="210" width="12" height="85" fill="#6b8499"/>
  <!-- Handrail -->
  <line x1="80" y1="170" x2="80" y2="200" stroke="#8fa3b5" stroke-width="2"/>
  <line x1="80" y1="170" x2="240" y2="140" stroke="#8fa3b5" stroke-width="2"/>
  <line x1="240" y1="140" x2="400" y2="170" stroke="#8fa3b5" stroke-width="2"/>
  <line x1="400" y1="170" x2="400" y2="200" stroke="#8fa3b5" stroke-width="2"/>
  <line x1="80" y1="185" x2="240" y2="155" stroke="#4a5d6e" stroke-width="1.5"/>
  <line x1="240" y1="155" x2="400" y2="185" stroke="#4a5d6e" stroke-width="1.5"/>
  <!-- AHU box -->
  <rect x="140" y="95" width="90" height="70" rx="3" fill="#4a5d6e" stroke="#8fa3b5" stroke-width="1.5"/>
  <rect x="148" y="103" width="30" height="22" fill="#0e1114" opacity="0.5"/>
  <rect x="186" y="103" width="30" height="22" fill="#0e1114" opacity="0.5"/>
  <circle cx="185" cy="145" r="8" fill="none" stroke="#e08a4f" stroke-width="2"/>
  <text x="185" y="90" text-anchor="middle" fill="#e08a4f" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">AHU</text>
  <!-- Pump -->
  <ellipse cx="310" cy="175" rx="28" ry="18" fill="#3a5568" stroke="#8fa3b5" stroke-width="1.5"/>
  <rect x="298" y="145" width="24" height="30" rx="2" fill="#6b8499" stroke="#8fa3b5"/>
  <circle cx="310" cy="155" r="6" fill="#c45c26"/>
  <text x="310" y="130" text-anchor="middle" fill="#e08a4f" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">PUMP</text>
  <!-- Stairs -->
  <polyline points="400,200 430,230 430,290 415,290 415,235 400,215" fill="#2c3640" stroke="#8fa3b5" stroke-width="1.5"/>
  <line x1="405" y1="220" x2="425" y2="240" stroke="#4a5d6e"/>
  <line x1="408" y1="235" x2="428" y2="255" stroke="#4a5d6e"/>
  <line x1="410" y1="250" x2="428" y2="268" stroke="#4a5d6e"/>
  <text x="240" y="350" text-anchor="middle" fill="#6b7883" font-size="10" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">DIAGRAM · RK-MEP EQUIPMENT PLATFORM</text>
</svg>
