<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Diagram: long-span utility corridor cross-section">
  <title>RK-CUDR Diagram</title>
  <desc>Cross-section of long-span central utility distribution rack with multi-trade corridors. Diagram only — not a project photo.</desc>
  <rect width="480" height="360" fill="#161b20"/>
  <!-- Ground line -->
  <line x1="30" y1="320" x2="450" y2="320" stroke="#2c3640" stroke-width="2"/>
  <!-- Left column -->
  <rect x="50" y="60" width="28" height="260" fill="#4a5d6e"/>
  <rect x="55" y="60" width="8" height="260" fill="#8fa3b5" opacity="0.4"/>
  <!-- Right column -->
  <rect x="402" y="60" width="28" height="260" fill="#4a5d6e"/>
  <rect x="417" y="60" width="8" height="260" fill="#8fa3b5" opacity="0.4"/>
  <!-- Top chord -->
  <rect x="50" y="60" width="380" height="16" fill="#8fa3b5"/>
  <!-- Mid chords / trays -->
  <rect x="78" y="110" width="324" height="12" fill="#c45c26" opacity="0.8"/>
  <text x="240" y="105" text-anchor="middle" fill="#e08a4f" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">CABLE / BUSWAY</text>
  <rect x="78" y="160" width="324" height="10" fill="#4a7a9e"/>
  <text x="240" y="155" text-anchor="middle" fill="#8fa3b5" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">PROCESS PIPING</text>
  <!-- Pipe circles on mid level -->
  <circle cx="120" cy="185" r="10" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <circle cx="160" cy="185" r="10" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <circle cx="200" cy="185" r="8" fill="none" stroke="#9aa7b2" stroke-width="2.5"/>
  <circle cx="235" cy="185" r="8" fill="none" stroke="#9aa7b2" stroke-width="2.5"/>
  <circle cx="270" cy="185" r="7" fill="none" stroke="#6b7883" stroke-width="2"/>
  <circle cx="305" cy="185" r="7" fill="none" stroke="#6b7883" stroke-width="2"/>
  <circle cx="340" cy="185" r="10" fill="none" stroke="#7a9e7e" stroke-width="3"/>
  <circle cx="380" cy="185" r="8" fill="none" stroke="#9aa7b2" stroke-width="2.5"/>
  <!-- Lower utility / HVAC -->
  <rect x="78" y="220" width="324" height="28" rx="2" fill="#2c3640" stroke="#8fa3b5" stroke-width="1"/>
  <text x="240" y="239" text-anchor="middle" fill="#8fa3b5" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">HVAC / MUA · SERVICE ZONE</text>
  <!-- Diagonal braces -->
  <line x1="78" y1="76" x2="200" y2="110" stroke="#6b8499" stroke-width="2"/>
  <line x1="402" y1="76" x2="280" y2="110" stroke="#6b8499" stroke-width="2"/>
  <line x1="78" y1="250" x2="200" y2="320" stroke="#4a5d6e" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="402" y1="250" x2="280" y2="320" stroke="#4a5d6e" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Span dimension -->
  <line x1="78" y1="300" x2="402" y2="300" stroke="#e08a4f" stroke-width="1"/>
  <line x1="78" y1="295" x2="78" y2="305" stroke="#e08a4f"/>
  <line x1="402" y1="295" x2="402" y2="305" stroke="#e08a4f"/>
  <text x="240" y="295" text-anchor="middle" fill="#e08a4f" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">LONG SPAN</text>
  <text x="240" y="348" text-anchor="middle" fill="#6b7883" font-size="10" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">DIAGRAM · RK-CUDR UTILITY CORRIDOR X-SECTION</text>
</svg>
