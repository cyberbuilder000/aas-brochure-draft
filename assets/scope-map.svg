<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Diagram: AAS capability rings — Structural, MEP Support, MEP Engineering, Integration, Commissioning">
  <title>Scope Map — Diagram</title>
  <desc>Five peer capability rings: Structural, MEP Support, MEP Engineering, Integration RK-INT, Commissioning readiness. Diagram only.</desc>
  <rect width="720" height="320" fill="#161b20"/>
  <circle cx="200" cy="160" r="130" fill="none" stroke="#c45c26" stroke-width="18" opacity="0.35"/>
  <circle cx="200" cy="160" r="100" fill="none" stroke="#8fa3b5" stroke-width="18" opacity="0.45"/>
  <circle cx="200" cy="160" r="70" fill="none" stroke="#e08a4f" stroke-width="18" opacity="0.55"/>
  <circle cx="200" cy="160" r="40" fill="#c45c26" opacity="0.9"/>
  <text x="200" y="165" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">CORE</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="380" y="28" width="14" height="14" fill="#c45c26"/>
    <text x="406" y="40" fill="#e8ecef" font-size="13" font-weight="700">Structural</text>
    <text x="406" y="58" fill="#9aa7b2" font-size="11">Racks, platforms, CUDR steel</text>

    <rect x="380" y="78" width="14" height="14" fill="#e08a4f"/>
    <text x="406" y="90" fill="#e8ecef" font-size="13" font-weight="700">MEP Support</text>
    <text x="406" y="108" fill="#9aa7b2" font-size="11">Structure that carries tray, busway, pipe, gear</text>

    <rect x="380" y="128" width="14" height="14" fill="#8fa3b5"/>
    <text x="406" y="140" fill="#e8ecef" font-size="13" font-weight="700">MEP Engineering</text>
    <text x="406" y="158" fill="#9aa7b2" font-size="11">Full M/E/P / process utilities — design packages,</text>
    <text x="406" y="174" fill="#9aa7b2" font-size="11">coordinated models; stamped drawings per jurisdiction</text>

    <rect x="380" y="194" width="14" height="14" fill="#c45c26" opacity="0.35"/>
    <rect x="380" y="194" width="14" height="14" fill="none" stroke="#c45c26" stroke-width="2"/>
    <text x="406" y="206" fill="#e8ecef" font-size="13" font-weight="700">Integration (RK-INT)</text>
    <text x="406" y="224" fill="#9aa7b2" font-size="11">BIM · envelopes · interfaces · sequenced delivery</text>

    <rect x="380" y="244" width="14" height="14" fill="#7a9e7e"/>
    <text x="406" y="256" fill="#e8ecef" font-size="13" font-weight="700">Commissioning</text>
    <text x="406" y="274" fill="#9aa7b2" font-size="11">Handoff / readiness packages · punchable turnover</text>
  </g>
  <text x="360" y="308" text-anchor="middle" fill="#6b7883" font-size="10" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">DIAGRAM · PEER CAPABILITIES</text>
</svg>
