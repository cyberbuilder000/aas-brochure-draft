<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Diagram: AAS scope rings — Structural, MEP Support, MEP Engineering, Integration">
  <title>Scope Map — Diagram</title>
  <desc>Four concentric capability rings: Structural (default), MEP Support, MEP Engineering when required, Integration RK-INT. Diagram only.</desc>
  <rect width="720" height="320" fill="#161b20"/>
  <!-- Concentric rings -->
  <circle cx="200" cy="160" r="130" fill="none" stroke="#c45c26" stroke-width="18" opacity="0.35"/>
  <circle cx="200" cy="160" r="100" fill="none" stroke="#8fa3b5" stroke-width="18" opacity="0.45"/>
  <circle cx="200" cy="160" r="70" fill="none" stroke="#e08a4f" stroke-width="18" opacity="0.55"/>
  <circle cx="200" cy="160" r="40" fill="#c45c26" opacity="0.9"/>
  <text x="200" y="165" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">CORE</text>
  <!-- Legend columns -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="380" y="36" width="14" height="14" fill="#c45c26"/>
    <text x="406" y="48" fill="#e8ecef" font-size="13" font-weight="700">Structural</text>
    <text x="406" y="66" fill="#9aa7b2" font-size="11">Default — racks, platforms, CUDR steel</text>

    <rect x="380" y="96" width="14" height="14" fill="#e08a4f"/>
    <text x="406" y="108" fill="#e8ecef" font-size="13" font-weight="700">MEP Support</text>
    <text x="406" y="126" fill="#9aa7b2" font-size="11">Structure that carries tray, busway, pipe, gear</text>

    <rect x="380" y="156" width="14" height="14" fill="#8fa3b5"/>
    <text x="406" y="168" fill="#e8ecef" font-size="13" font-weight="700">MEP Engineering (when required)</text>
    <text x="406" y="186" fill="#9aa7b2" font-size="11">Full M/E/P / process utilities — design packages,</text>
    <text x="406" y="202" fill="#9aa7b2" font-size="11">coordinated models; stamped drawings per project jurisdiction</text>

    <rect x="380" y="232" width="14" height="14" fill="#c45c26" opacity="0.35"/>
    <rect x="380" y="232" width="14" height="14" fill="none" stroke="#c45c26" stroke-width="2"/>
    <text x="406" y="244" fill="#e8ecef" font-size="13" font-weight="700">Integration (RK-INT)</text>
    <text x="406" y="262" fill="#9aa7b2" font-size="11">BIM · envelopes · interfaces · sequenced handoff</text>
  </g>
  <text x="360" y="308" text-anchor="middle" fill="#6b7883" font-size="10" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">DIAGRAM · SCOPE CAPABILITIES</text>
</svg>
