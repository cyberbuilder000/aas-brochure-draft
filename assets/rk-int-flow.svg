<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-label="Diagram: six-step integration flow">
  <title>RK-INT Integration Flow — Diagram</title>
  <desc>Six-step flow: Routing → BIM → MEP engineering → Fabricate → Sequenced ship → Commissioning handoff. Diagram only.</desc>
  <rect width="900" height="220" fill="#161b20"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e08a4f"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="16" y="50" width="120" height="100" rx="4" fill="#1c2329" stroke="#2c3640"/>
    <circle cx="76" cy="78" r="14" fill="#c45c26"/>
    <text x="76" y="83" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text>
    <text x="76" y="112" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">ROUTING</text>
    <text x="76" y="130" text-anchor="middle" fill="#9aa7b2" font-size="9">Layouts / BIM in</text>
    <line x1="140" y1="100" x2="158" y2="100" stroke="#e08a4f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="164" y="50" width="120" height="100" rx="4" fill="#1c2329" stroke="#2c3640"/>
    <circle cx="224" cy="78" r="14" fill="#c45c26"/>
    <text x="224" y="83" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text>
    <text x="224" y="112" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">BIM</text>
    <text x="224" y="130" text-anchor="middle" fill="#9aa7b2" font-size="9">Clash / envelopes</text>
    <line x1="288" y1="100" x2="306" y2="100" stroke="#e08a4f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="312" y="50" width="130" height="100" rx="4" fill="#1c2329" stroke="#8fa3b5" stroke-width="1.5"/>
    <circle cx="377" cy="78" r="14" fill="#8fa3b5"/>
    <text x="377" y="83" text-anchor="middle" fill="#0e1114" font-size="14" font-weight="700">3</text>
    <text x="377" y="112" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">MEP ENG</text>
    <text x="377" y="130" text-anchor="middle" fill="#9aa7b2" font-size="9">Peer capability</text>
    <line x1="446" y1="100" x2="464" y2="100" stroke="#e08a4f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="470" y="50" width="120" height="100" rx="4" fill="#1c2329" stroke="#2c3640"/>
    <circle cx="530" cy="78" r="14" fill="#c45c26"/>
    <text x="530" y="83" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">4</text>
    <text x="530" y="112" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">FABRICATE</text>
    <text x="530" y="130" text-anchor="middle" fill="#9aa7b2" font-size="9">Factory-direct</text>
    <line x1="594" y1="100" x2="612" y2="100" stroke="#e08a4f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="618" y="50" width="120" height="100" rx="4" fill="#1c2329" stroke="#2c3640"/>
    <circle cx="678" cy="78" r="14" fill="#c45c26"/>
    <text x="678" y="83" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">5</text>
    <text x="678" y="112" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">SHIP</text>
    <text x="678" y="130" text-anchor="middle" fill="#9aa7b2" font-size="9">Sequenced loads</text>
    <line x1="742" y1="100" x2="760" y2="100" stroke="#e08a4f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="766" y="50" width="120" height="100" rx="4" fill="#1c2329" stroke="#7a9e7e" stroke-width="1.5"/>
    <circle cx="826" cy="78" r="14" fill="#7a9e7e"/>
    <text x="826" y="83" text-anchor="middle" fill="#0e1114" font-size="14" font-weight="700">6</text>
    <text x="826" y="112" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">COMMISSION</text>
    <text x="826" y="130" text-anchor="middle" fill="#9aa7b2" font-size="9">Readiness / handoff</text>
  </g>
  <text x="450" y="200" text-anchor="middle" fill="#6b7883" font-size="10" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">DIAGRAM · RK-INT 6-STEP INTEGRATION FLOW</text>
</svg>
